<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/240/education.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AttendFlow Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; transition: background 0.3s; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        @media (prefers-color-scheme: dark) {
            body { background-color: #0f172a; color: white; }
            .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); }
            input { background: #1e293b !important; color: white; border-color: #334155 !important; }
        }
        .bubbly { transition: transform 0.1s; }
        .bubbly:active { transform: scale(0.95); }
        .log-enter { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-6 pb-40">

    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">AttendFlow</h1>
            <p class="text-slate-500 dark:text-slate-400 font-medium">Flexible Subject Tracking</p>
        </div>
        <button onclick="exportData()" class="text-xs bg-slate-200 dark:bg-slate-800 px-3 py-1 rounded-full">Backup</button>
    </header>

    <div id="subjectList" class="space-y-6"></div>

    <div class="fixed bottom-6 left-6 right-6 z-50">
        <div class="glass-card p-4 rounded-3xl shadow-2xl space-y-3">
            <div class="flex gap-2">
                <input id="subInput" type="text" placeholder="Add Subject (e.g. Physics)" 
                    class="flex-1 bg-white border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white">
                <button onclick="addSubject()" class="bg-indigo-600 bubbly text-white px-6 py-3 rounded-xl font-bold shadow-lg">
                    Add
                </button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden flex items-end">
        <div class="bg-white dark:bg-slate-900 w-full max-h-[80vh] rounded-t-[32px] p-8 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modalTitle" class="text-2xl font-bold">Attendance Log</h2>
                <button onclick="closeHistory()" class="text-slate-400 text-2xl">&times;</button>
            </div>
            <div id="historyContent" class="space-y-3"></div>
        </div>
    </div>

    <script>
        let subjects = JSON.parse(localStorage.getItem('attendflow_v2')) || [];

        function save() {
            localStorage.setItem('attendflow_v2', JSON.stringify(subjects));
            render();
        }

        function addSubject() {
            const name = document.getElementById('subInput').value;
            if (!name.trim()) return;
            subjects.push({ id: Date.now(), name, logs: [] }); // Store logs instead of simple counts
            document.getElementById('subInput').value = '';
            save();
        }

        function mark(id, type) {
            const sub = subjects.find(s => s.id === id);
            const timestamp = new Date().toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            sub.logs.unshift({ type, time: timestamp, logId: Date.now() });
            save();
        }

        function deleteLog(subId, logId) {
            const sub = subjects.find(s => s.id === subId);
            sub.logs = sub.logs.filter(l => l.logId !== logId);
            save();
            showHistory(subId); // Refresh modal
        }

        function showHistory(id) {
            const sub = subjects.find(s => s.id === id);
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            document.getElementById('modalTitle').innerText = sub.name;
            
            content.innerHTML = sub.logs.length ? '' : '<p class="text-slate-400">No records yet.</p>';
            sub.logs.forEach(log => {
                const isPresent = log.type === 'P';
                content.innerHTML += `
                    <div class="flex justify-between items-center p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 log-enter">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 rounded-full flex items-center justify-center font-bold ${isPresent ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                                ${log.type}
                            </div>
                            <div>
                                <p class="font-semibold">${isPresent ? 'Present' : 'Absent'}</p>
                                <p class="text-xs text-slate-400">${log.time}</p>
                            </div>
                        </div>
                        <button onclick="deleteLog(${id}, ${log.logId})" class="text-slate-300">Remove</button>
                    </div>
                `;
            });
            modal.classList.remove('hidden');
        }

        function closeHistory() { document.getElementById('historyModal').classList.add('hidden'); }

        function render() {
            const container = document.getElementById('subjectList');
            container.innerHTML = '';

            subjects.forEach(sub => {
                const present = sub.logs.filter(l => l.type === 'P').length;
                const total = sub.logs.length;
                const percent = total === 0 ? 0 : Math.round((present / total) * 100);
                const isSafe = percent >= 75;

                container.innerHTML += `
                    <div class="glass-card p-6 rounded-[24px] shadow-sm relative">
                        <div class="flex justify-between items-start mb-4">
                            <div onclick="showHistory(${sub.id})" class="cursor-pointer">
                                <h3 class="text-xl font-bold dark:text-white">${sub.name}</h3>
                                <p class="text-xs font-semibold uppercase tracking-wider ${isSafe ? 'text-emerald-500' : 'text-rose-500'}">
                                    ${percent}% • ${isSafe ? 'On Track' : 'Below 75%'}
                                </p>
                            </div>
                            <button onclick="if(confirm('Delete subject?')) { subjects = subjects.filter(s => s.id !== ${sub.id}); save(); }" class="text-slate-300">✕</button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="mark(${sub.id}, 'P')" class="bubbly py-4 rounded-2xl bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-500/20">Present</button>
                            <button onclick="mark(${sub.id}, 'A')" class="bubbly py-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-slate-600 dark:text-slate-300 shadow-sm">Absent</button>
                        </div>
                        
                        <div class="mt-4 flex justify-between text-[10px] text-slate-400 font-bold uppercase tracking-widest">
                            <span>History: ${total} Total Classes</span>
                            <span onclick="showHistory(${sub.id})" class="text-indigo-500">View Logs →</span>
                        </div>
                    </div>
                `;
            });
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(subjects));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "attendance_backup.json");
            dlAnchorElem.click();
        }

        render();
    </script>
</body>
</html>
